<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Consolas, 'Microsoft YaHei', monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#37474f"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c62828"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#263238">框架与模块共演化（双螺旋）</text>

  <!-- 两列标题 -->
  <rect x="60" y="48" width="220" height="30" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="96" y="68" fill="#0d47a1" font-weight="bold">框架线（结构性资产）</text>
  <rect x="560" y="48" width="220" height="30" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="600" y="68" fill="#1b5e20" font-weight="bold">模块线（功能资产）</text>

  <!-- 框架版本节点 -->
  <rect x="100" y="100" width="140" height="34" rx="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="136" y="122" fill="#0d47a1">框架 v0.1 骨架</text>

  <rect x="100" y="220" width="140" height="34" rx="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="136" y="242" fill="#0d47a1">框架 v0.2</text>

  <rect x="100" y="350" width="140" height="34" rx="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="136" y="372" fill="#0d47a1">框架 v0.3 …</text>

  <!-- 模块节点 -->
  <rect x="590" y="100" width="140" height="34" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="622" y="122" fill="#1b5e20">模块 M01 实现</text>

  <rect x="590" y="220" width="140" height="34" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="622" y="242" fill="#1b5e20">模块 M02 实现</text>

  <rect x="590" y="350" width="140" height="34" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="622" y="372" fill="#1b5e20">模块 M03 实现</text>

  <!-- 框架 → 模块 提供契约 -->
  <path d="M240,117 L580,117" stroke="#37474f" stroke-dasharray="5,4" marker-end="url(#arrow)" fill="none"/>
  <text x="330" y="110" fill="#546e7a">提供契约 / 可装配骨架</text>

  <path d="M240,237 L580,237" stroke="#37474f" stroke-dasharray="5,4" marker-end="url(#arrow)" fill="none"/>
  <text x="330" y="230" fill="#546e7a">提供契约 / 可装配骨架</text>

  <path d="M240,367 L580,367" stroke="#37474f" stroke-dasharray="5,4" marker-end="url(#arrow)" fill="none"/>
  <text x="330" y="360" fill="#546e7a">提供契约 / 可装配骨架</text>

  <!-- 模块 → 框架 适配性回判 -->
  <path d="M590,150 C420,180 300,190 200,215" stroke="#2e7d32" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="330" y="176" fill="#2e7d32">适配 → 继续下一模块</text>

  <path d="M590,270 C420,300 300,320 200,345" stroke="#2e7d32" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="330" y="296" fill="#2e7d32">适配 → 继续下一模块</text>

  <!-- 不适配 → 框架变更 -->
  <path d="M660,254 L660,300 L450,300 L450,410 L200,410 L200,384" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <rect x="360" y="286" width="180" height="30" fill="#ffebee" stroke="#c62828"/>
  <text x="374" y="306" fill="#b71c1c">不适配 → 框架变更申请</text>
  <text x="374" y="336" fill="#b71c1c" font-size="11">影响分析：受影响模块 / 需求 / 回归范围</text>

  <!-- 模块完成 -->
  <path d="M730,134 L800,134 L800,470 L660,470 L660,384" stroke="#2e7d32" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="742" y="300" fill="#2e7d32" font-size="11" transform="rotate(90 742,300)">模块完成 → 下一模块</text>

  <!-- 底部说明 -->
  <text x="60" y="500" fill="#546e7a" font-size="12">健康信号：框架变更次数 / 已实现模块数 &lt; 0.5；且触发条件以 FC-1 契约不足、FC-3 假设被推翻为主。</text>
</svg>
