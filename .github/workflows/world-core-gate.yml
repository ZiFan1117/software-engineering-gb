name: world-core 门禁

# ⚠️ 本文件**必须**位于**仓库根**的 `.github/workflows/` 下。
#    GitHub Actions **只发现仓库根的工作流**——放在子目录（如
#    `world-core/.github/workflows/`）等于**不存在**：不是"没跑过"，而是
#    "结构上不可能跑"。2026-09-26 实测：本文件原在 world-core/.github/ 下，
#    `gh run list` 输出为空、仓库根无 `.github/`，CI 从未也不可能运行。
#    详见 docs/S0-立项/WC-SCMP-001-v0.1.md §8.4 G-11。
#    因此本文件每个 step 都显式写 `working-directory: world-core`。
#
# 把「能自动判定的门禁」全部交给 CI：
#   - L0 骨架冒烟（S3 准出）：一条命令跑通 + 打印 READY
#   - L1 单元 + 验收测试（S4 逐模块准出）
#   - RTM 需求追溯完整性（S1 / S5 / S6 准出）
#   - 改动范围检查（受控变更，防止静默改框架与越界重构）
#   - 门禁工具自测（tools/ 校验器）
# 人工评审只负责机器判不了的判断项（契约合理性、假设成立性、测试覆盖真实风险）。
#
# ⚠️ 本文件是「门禁自身」，属敏感路径，两道约束：
#    ① 工具侧——`tools/scope_check.py` 的 `JOINT_JURISDICTION` + `SENSITIVE_PATHS`
#       把它拉回本门禁管辖：改动它**必须写进 `.scope-declaration.json`**，
#       否则 scope 作业判为越界。理由：不给"改门禁不需要声明"留口子。
#    ② 流程侧——修改它必须走 R5 框架变更评审，并在 PR 中说明理由——
#       否则「放宽门禁」会成为最容易的作弊路径。
#
# ⚠️ **严禁 `continue-on-error`**。gate-self-test 作业会检查这一点，
#    检查范围是仓库根 `.github/workflows/` 下的**全部**工作流。
#
# ⚠️ 五个作业名不可删改（tools/ci_self_check.py 的 REQUIRED_JOBS）：
#    smoke / unit-test / gate-self-test / traceability / scope

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

  # ── 追溯门禁的强度开关（本工作流**唯一**允许的阶段开关）──────────────────
  # S1–S4：需求已建立、但多数尚未实现。此时若启用 --strict（状态仅允许
  #         「已实现/已测试/已验收」），门禁将**永远无法通过**——
  #         而"永远红的门禁"等于没有门禁。本项目已因这一类缺陷栽过两次：
  #         G-09（scope 路径口径错，永远红得没意义）、G-11（工作流位置错，跑不了）。
  #         故 S1–S4 用非严格模式：仍强制"完整性 + 用例存在 + 编号合规 +
  #         用例与需求对得上（语义追溯一致性）"。
  #         ⚠ 2026-09-26 订正：原文此处写"双向一致"——**该反向检查未实现**
  #         （tools/trace_matrix.py 的 docstring 声称"反向 测试用例 → 需求"，
  #          但代码中无该读取路径；实测反向差集 11 处非空而 rc=0）。
  #         登记见 WC-SCMP-001 §8.4 G-40；在该检查实现之前不得声称"双向一致"。
  # S5 起：**必须**改为 "true"（测试准出要求需求已达可交付状态），并留痕。
  #         记录见 WC-SCMP-001 §8.4 G-14；tools/ci_self_check.py 会断言本常量存在，
  #         防止它被悄悄删掉（删掉=永久失去严格模式的可能性）。
  RTM_STRICT: "false"

jobs:
  smoke:
    name: L0 骨架冒烟（S3 门禁：一条命令跑通）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 格式检查
        working-directory: world-core
        run: cargo fmt --all -- --check
      - name: 静态检查（警告即失败）
        working-directory: world-core
        run: cargo clippy --all-targets -- -D warnings
      - name: 构建
        working-directory: world-core
        run: cargo build --locked
      - name: 骨架冒烟 —— 必须打印 READY
        working-directory: world-core
        run: |
          rm -f ci-smoke.jsonl ci-smoke.lock
          out=$(cargo run --quiet -- --ledger ci-smoke.jsonl check)
          echo "$out"
          echo "$out" | grep -q READY
          # ── 新账本必须带摘要链（WC-SCMP-001 变更请求台账 · WC-CR-003）──
          # 此前只有 VM 侧的 check.sh 在盯这件事；CI 也盯上，它才真正是被强制的。
          cargo run --quiet -- --ledger ci-smoke.jsonl append change \
            '{"subject":"world://ci/probe","path":"p","before":null,"after":1}' > /dev/null
          out2=$(cargo run --quiet -- --ledger ci-smoke.jsonl check)
          echo "$out2"
          echo "$out2" | grep -q '有摘要链' || { echo "::error::新账本未带摘要链（WC-SCMP-001 变更请求台账 · WC-CR-003）"; exit 1; }
          cargo run --quiet -- --ledger ci-smoke.jsonl --require-chain check > /dev/null
          echo "摘要链：新账本带链，--require-chain 通过"
      - name: 系统级验收 —— TC-037–TC-040（真实二进制端到端）
        working-directory: world-core
        run: |
          # ⚠️ 先自证判定器会红（"一个从不失败的检查不是检查，是装饰"）
          bash tools/system_acceptance.sh --self-test
          # 再跑 4 条系统级用例：只追加/无第二条写路径、信封 8 必填字段与版本、
          # 状态=账本投影（含反假断言）、本体缺失·损坏·版本不符三拒启
          bash tools/system_acceptance.sh

  unit-test:
    name: L1 单元 + 验收测试（S4 门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 全量测试
        working-directory: world-core
        run: cargo test --locked --verbose

  gate-self-test:
    name: 门禁工具自测（tools/ 校验器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 确认 CI 自身没有被 continue-on-error 削弱、且必需作业齐备
        working-directory: world-core
        run: python tools/ci_self_check.py
      - name: 范围声明必须是合法 JSON 且非空
        working-directory: world-core
        run: |
          python -c "import json,sys; d=json.load(open('.scope-declaration.json',encoding='utf-8')); sys.exit(0 if d.get('allowed') else 1)"
      - name: 纯文本审计（REQ-N-001 / AC-07；先自证工具会失败）
        working-directory: world-core
        run: |
          # ⚠️ 先自证：**没有反例的自测等于没测**（本项目的老教训）
          python tools/plain_text_audit.py --self-test
          # 再审真实产物：词表与策略（账本由 smoke 作业在沙箱里产生，不入库）
          python tools/plain_text_audit.py ontology.json policy.json
      - name: 门禁工具可用性（用示例数据自证工具链是通的）
        working-directory: world-core
        run: |
          # ⚠️ 本步只证明"工具链是通的"，**不是**追溯结论：
          # `--sample` = **显式**索取 docs/阶段外-待启用/_非本项目样例/ 的示例数据
          #（该模式自带跳过模块登记表校验，且结论**不会**写成"覆盖率 100%"）。
          # 真实数据的追溯由 traceability 作业负责（trace_matrix 裸跑默认即真实产物）。
          # ⚠️ 样例数据**不得**在未加 --sample 时被当成输入：那样工具会直接判不通过。
          python tools/trace_matrix.py --sample

  traceability:
    name: RTM 需求追溯门禁（S1 / S5 / S6）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验需求双向追溯完整性
        working-directory: world-core
        run: |
          SRS="docs/S1-需求/WC-SRS-001-v0.1.md"
          RTM="docs/S1-需求/WC-RTM-001.csv"
          # 阶段开关（见文件顶部 RTM_STRICT 的说明）：S1–S4 非严格，S5 起严格。
          STRICT=""
          if [ "$RTM_STRICT" = "true" ]; then STRICT="--strict"; fi
          echo "追溯门禁强度：RTM_STRICT=${RTM_STRICT}（STRICT='${STRICT}'）"
          if [ -f "$RTM" ]; then
            python tools/trace_matrix.py --matrix "$RTM" --srs "$SRS" $STRICT
          elif [ -f "$SRS" ]; then
            echo "::error::SRS 已存在但 RTM 缺失 —— S1 未完成，追溯门禁不通过"
            exit 1
          else
            echo "::warning::S1 尚未开始（无 SRS/RTM）—— 追溯门禁在 S1 前不适用。"
            echo "::warning::S1 产出 WC-RTM-001.csv 后本作业自动强制生效；不得改为静默跳过。"
          fi

  scope:
    name: 改动范围门禁（受控变更）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验改动是否越界
        working-directory: world-core
        run: |
          python tools/scope_check.py \
            --base origin/${{ github.base_ref }} \
            --scope .scope-declaration.json
        # 退出码语义（见 tools/scope_check.py 文档字符串）：
        #   0 = 范围合规   → 通过
        #   1 = 越界       → 阻断（门禁不通过）
        #   2 = 环境不可用 → 阻断（「未能校验」不等于「校验通过」）
        #
        # ⚠️ 此处**不得**再加 continue-on-error: true。
        # 若某次变更确需越界，正确做法是更新 .scope-declaration.json
        # （并走 R5 框架变更评审），而不是绕过门禁。
